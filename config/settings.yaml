# Global assistant settings

assistant_name: "Assistant"

paths:
  # Named locations the path resolver understands out of the box.
  # Anything not listed here falls back to a search under the user's home dir.
  desktop: "~/Desktop"
  documents: "~/Documents"
  downloads: "~/Downloads"
  default_create_location: "desktop"   # used when user doesn't specify a folder

voice:
  # No wake word: --voice starts listening immediately (VAD-based, see
  # voice/stt.py's listen_until_silence) rather than idling for a trigger
  # phrase. Simpler to demo/dev with; revisit if always-on listening turns
  # out to be undesirable for a given deployment.
  stt_model: "base.en"        # faster-whisper model size ("tiny.en" is faster/less accurate)
  stt_device: "cpu"
  stt_compute_type: "int8"
  stt_cpu_threads: 2           # cap on CPU threads whisper uses - keeps `--all` mode's
                                # gesture loop from getting starved of CPU during transcription;
                                # raise this (e.g. to 4+) if you only ever run --voice on its own
  tts_rate: 175

llm_fallback:
  enabled: true
  provider: "ollama"
  model: "qwen2.5:1.5b"
  # Only called when the rule-based parser can't confidently classify input.

gestures:
  cooldown_seconds: 0.6
  fist_hold_seconds: 0.7
  camera_index: 0

  # Camera capture settings. MediaPipe's per-frame hand-tracking cost scales
  # heavily with resolution - a webcam left at its default (often 720p/1080p)
  # can single-handedly tank FPS and make swipes look "unrecognized" simply
  # because too few, too-stale frames get processed per second. 640x480 is
  # plenty for gesture recognition; raise it only if detection accuracy
  # actually needs the extra detail (rare).
  camera_width: 640
  camera_height: 480
  camera_fps: 30

  # MediaPipe Hands confidence thresholds. Lower these if hands aren't being
  # detected/tracked at all (e.g. dim lighting); raise them if you're getting
  # jittery/false hand detections.
  detection_confidence: 0.7
  tracking_confidence: 0.6

  # Swipe-gesture sensitivity. If swipes (left/right/up/down) aren't
  # registering, try lowering swipe_min_travel_fraction (how far, as a
  # fraction of frame width/height, your hand must move) or raising
  # swipe_window_seconds (how long that movement is allowed to take).
  swipe_window_seconds: 0.35
  swipe_min_travel_fraction: 0.18

  # How much bigger the dominant axis's movement must be than the other
  # axis before a swipe commits to left/right vs up/down (e.g. 1.3 = 30%
  # bigger). Raise this if up/down and left/right sometimes get swapped
  # on a mostly-but-not-perfectly-straight swipe; lower it (toward 1.0)
  # if clearly-vertical/horizontal swipes feel slow to register.
  swipe_dominance_ratio: 1.3

  # Exponential smoothing applied to the tracked hand point before swipe
  # direction is computed (1.0 = no smoothing/fully raw and jitter-prone,
  # lower = smoother but slightly laggier). Raw landmark jitter is the
  # main reason a swipe's direction can feel like it "flickers" between
  # two readings; 0.55 is a reasonable middle ground between stability
  # and responsiveness.
  swipe_smoothing_alpha: 0.55

  # PERFORMANCE: MediaPipe runs its detection pass on a copy of the frame
  # scaled down by this factor (e.g. 0.7 = 30% fewer pixels per axis).
  # Landmarks come back normalized to [0,1], so this doesn't affect
  # accuracy of on-screen drawing/overlay - only how much work the model
  # does per frame. 1.0 disables downscaling; lower it further (e.g. 0.5)
  # on slower machines if the video feed still feels laggy.
  process_scale: 0.7

safety:
  use_trash_not_permanent_delete: true
  require_confirmation_for_delete: true
  require_confirmation_for_close: true
